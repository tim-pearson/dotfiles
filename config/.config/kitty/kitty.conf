# Remove the include below to disconnect Kitty from Omarchy's theming system.
# include ~/.local/state/omarchy/current/theme/kitty.conf
include colors.conf

# Settings below override Omarchy's defaults in /etc/xdg/kitty/kitty.conf.
# Learn more: https://sw.kovidgoyal.net/kitty/conf/

# Font
# font_family JetBrainsMono Nerd Font
# font_size 12

# Window padding
window_padding_width 0

# Unmap a shortcut, passing it through to the terminal application
# map ctrl+insert

# Set or replace a shortcut
# map ctrl+shift+c copy_to_clipboard

# Remove all inherited shortcuts, including Kitty's built-in shortcuts
# clear_all_shortcuts yes

font_size 13.0


# CUSTOM
background_opacity  0.7

# Scrollback pager
# scrollback_pager ~/.local/bin/kitty-scrollback
# map ctrl+shift+h show_scrollback

allow_remote_control socket-only
listen_on unix:/tmp/kitty
shell_integration enabled



# kitty-scrollback.nvim
action_alias kitty_scrollback_nvim kitten '/home/mit/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py'

map kitty_mod+h kitty_scrollback_nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output

mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output


map kitty_mod+equal change_font_size all +0.25
map kitty_mod+plus change_font_size all +0.25
map kitty_mod+minus change_font_size all -0.25
map kitty_mod+backspace change_font_size all 0



# Make terminal comments and muted text readable
color8 #8fa995
